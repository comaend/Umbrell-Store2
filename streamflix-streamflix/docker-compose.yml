# StreamFlix — Umbrel Community App Store docker-compose.yml
#
# Umbrel baut das Image automatisch aus dem Dockerfile (keine manuellen Docker-Befehle).
# Alle Abhängigkeiten (PHP 8.2, Nginx, FFmpeg, SQLite) sind im Image enthalten.
# Der app_proxy wird automatisch von Umbrel basierend auf dem Manifest-Port (8080) hinzugefügt.
#
# Medienordner schreibgeschützt einbinden (weitere Bind-Mounts bei Bedarf):
#   - /mnt/hdd/Movies:/media/Movies:ro
#   - /mnt/hdd/Series:/media/Series:ro

version: "3.7"

services:
  streamflix:
    build: .
    restart: unless-stopped
    stop_grace_period: 1m
    user: "1000:1000"
    volumes:
      # Persistente App-Daten (Datenbank, Uploads, Cache)
      - streamflix_data:/var/www/html/data
      # Medienbibliothek schreibgeschützt (Pfad über Umbrel-Speicher oder Bind-Mount)
      - /media:/media:ro
    environment:
      APP_DATA_DIR: /var/www/html/data
      MEDIA_ROOT: /media
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/health.php"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  streamflix_data:
